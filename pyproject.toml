[project]
name = "ai-content-assistant"
version = "0.1.0"
description = "AI-powered multi-agent content marketing assistant"
readme = "README.md"
authors = [
    { name = "Niranjan Marathe", email = "niranjan.marathe@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.0.0",
    "streamlit>=1.35.0",
    "google-search-results>=2.4.0",
    "httpx>=0.27.0",
    "certifi>=2023.11.7",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0.0",
    "cachetools>=5.3.0",
]

[project.scripts]
ai-content-assistant = "ai_content_assistant.web_app.streamlit_app:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

services:
  app:
    build:
      context: .
      target: runtime
    image: ai-content-assistant:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
